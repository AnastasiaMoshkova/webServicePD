version: "3.9"

services:
  pd_web:
    build:
      dockerfile: Dockerfile
    image: pd_web:latest
    restart: always
    container_name: pd_web
    ports:
      - "8000:8000"
    environment:
      # Этот compose-файл (без nginx) не терминирует TLS — приложение доступно
      # напрямую по http://localhost:8000. Редирект на https сломал бы такой
      # доступ, поэтому здесь он выключен. При деплое за nginx с сертификатом
      # (docker-compose_nginx.yaml) выставить HTTPS_REDIRECT=1.
      - HTTPS_REDIRECT=0
    volumes:
      - ./app:/app/app
      - ./core:/app/core
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      webservicepd_pd_web_net:
        aliases:
          - pd_web

networks:
  webservicepd_pd_web_net:
    driver: bridge
